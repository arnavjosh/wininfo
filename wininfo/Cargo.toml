[package]
name = "wmr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Simple Windows system information library"

[features]
cli = ["dep:clap", "dep:miette"]
default = ["cli"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "wininfo_cli"
path = "src/bin/wininfo_cli/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
byte-unit = {version = "5", features = ["serde"]}
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
wmi = "0.15"

# CLI specific dependencies
clap = { version = "4", features = ["derive"], optional = true}
miette = { version = "7", features = ["fancy"], optional = true}
